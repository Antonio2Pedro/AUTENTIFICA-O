{% extends "base.html" %}
{% block title %}Login · DocAuth AI{% endblock %}

{% block content %}
<section class="login-panel">
    <div class="login-brand">
        <span class="brand-mark brand-mark-lg">D</span>
        <div>
            <h1>DocAuth AI</h1>
            <p>Verificacao inteligente de documentos institucionais.</p>
        </div>
    </div>

    <form method="post" class="login-form">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" value="admin@example.com" required>

        <label class="form-label mt-3" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" value="admin123" required>

        <button class="btn btn-primary w-100 mt-4" type="submit">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
        </button>
    </form>

    <div class="demo-credentials">
        <strong>Demonstracao</strong>
        <span>admin@example.com / admin123</span>
        <span>funcionario@example.com / func123</span>
    </div>
</section>
{% endblock %}
